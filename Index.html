<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Facturación</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mut:#6b6a66;--line:#e2e0da;--acc:#1f5f5b;--acc-ink:#fff;--ok:#1e7a46;--okbg:#e3f3e9;--warn:#8a5a00;--warnbg:#fbefd2;--err:#a32a2a;--errbg:#fbe4e2;--mutbg:#eceae5}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#201f1e;--ink:#ecebe7;--mut:#a09e98;--line:#35332f;--acc:#58b3ab;--acc-ink:#0d1f1e;--ok:#6fd09a;--okbg:#17362a;--warn:#e6bd62;--warnbg:#3a2e12;--err:#f08f88;--errbg:#3d1c1a;--mutbg:#2b2a27}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1200px;margin:0 auto}
.brand{font-weight:700;letter-spacing:-.01em;font-size:17px;margin-right:auto}
nav{display:flex;gap:2px;overflow-x:auto;padding:0 12px;max-width:1200px;margin:0 auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:9px 12px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:18px 16px 60px}
h2{font-size:20px;margin:0 0 14px;letter-spacing:-.01em}
h3{font-size:15px;margin:22px 0 8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 12px;font:inherit;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.btn.sm{padding:3px 8px;font-size:13px}
.btn.danger{color:var(--err)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
input[type=checkbox]{width:auto}
textarea{resize:vertical;min-height:60px}
.bar input,.bar select{width:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.act{text-align:right;white-space:nowrap}
td.act .btn{margin-left:4px}
.mut{color:var(--mut)}
.small{font-size:13px}
.badge{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;background:var(--mutbg);color:var(--mut);white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.err{background:var(--errbg);color:var(--err)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.kpi{padding:14px}
.kpi .l{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--mut)}
.empty{padding:34px 16px;text-align:center;color:var(--mut)}
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--card);color:var(--ink);width:min(780px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form,dialog .dbody{padding:18px}
dialog h2{margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
.grid>label{grid-column:span 6;font-size:13px;color:var(--mut);display:block}
.grid>label.c3{grid-column:span 3}.grid>label.c4{grid-column:span 4}.grid>label.c8{grid-column:span 8}.grid>label.c12{grid-column:span 12}
.grid>label.chk{display:flex;align-items:center;gap:7px;color:var(--ink);font-size:15px;padding-top:18px}
.grid input,.grid select,.grid textarea{margin-top:3px}
@media(max-width:640px){.grid>label,.grid>label.c3,.grid>label.c4,.grid>label.c8{grid-column:span 12}}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.lineas td{padding:4px 4px;border:0}
.lineas th{padding:4px}
.tot{margin-left:auto;width:min(320px,100%);margin-top:10px}
.tot div{display:flex;justify-content:space-between;padding:3px 0;font-variant-numeric:tabular-nums}
.tot .big{font-weight:700;font-size:18px;border-top:2px solid var(--ink);margin-top:4px;padding-top:6px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;max-width:min(560px,92vw);box-shadow:0 4px 18px rgba(0,0,0,.25);pointer-events:auto}
#toast div.err{background:var(--err);color:#fff}
#toast div a{color:inherit}
#busy{position:fixed;top:0;left:0;height:3px;width:100%;z-index:100;background:linear-gradient(90deg,transparent,var(--acc),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:bz 1s linear infinite;display:none}
body.busy #busy{display:block}
body.busy main,body.busy dialog{pointer-events:none;opacity:.75}
@keyframes bz{from{background-position:-40% 0}to{background-position:140% 0}}
.note{background:var(--mutbg);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--mut);margin-top:12px}
.sug{font-size:13px}
a{color:var(--acc)}
</style>
</head>
<body>
<div id="busy"></div>
<header>
  <div class="top">
    <div class="brand">Facturación</div>
    <select id="empSel" data-c="empresa" style="width:auto;max-width:55vw"></select>
  </div>
  <nav id="nav"></nav>
</header>
<main id="view"><div class="empty">Cargando…</div></main>
<dialog id="dlg"></dialog>
<dialog id="cdlg" style="width:min(440px,calc(100vw - 24px))"></dialog>
<div id="toast"></div>

<script>
/* ============================ Estado ============================ */
var S = { empresas: [], clientes: [], facturas: [], gastos: [], movimientos: [], backups: null, links: {}, user: '', autorizados: '', ia: false, solicitudes: [], rol: 'admin', asistentes: '' };
var TABLES = ['empresas', 'clientes', 'facturas', 'gastos', 'movimientos', 'solicitudes'];
var cur = { view: 'panel', empresaId: '', year: new Date().getFullYear(), q: Math.floor(new Date().getMonth() / 3) + 1, fF: 'todas', fG: 'todos', fB: 'pendiente', sF: '', sG: '', sB: '', sC: '' };
var VIEWS = [['panel', 'Panel'], ['facturas', 'Facturas'], ['gastos', 'Gastos'], ['banco', 'Banco'], ['clientes', 'Clientes'], ['impuestos', 'Trimestres'], ['ajustes', 'Ajustes']];
var CATEGORIAS = ['Servicios profesionales', 'Software y suscripciones', 'Telefonía e internet', 'Suministros', 'Alquiler', 'Viajes y dietas', 'Vehículo', 'Material de oficina', 'Seguros', 'Comisiones bancarias', 'Impuestos y tasas', 'Marketing', 'Otros'];
var IVAS = [21, 10, 4, 0];
var draftF = null, bankDraft = null;

/* ============================ Utilidades ============================ */
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
var NF = new Intl.NumberFormat('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: true });
function eur(n) { return NF.format(Number(n) || 0) + ' €'; }
function num(v) { var n = parseFloat(String(v === null || v === undefined ? '' : v).replace(',', '.')); return isNaN(n) ? 0 : n; }
function r2(x) { x = Number(x) || 0; var s = x < 0 ? -1 : 1; return s * Math.round((Math.abs(x) + 1e-9) * 100) / 100; }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function isoOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function today() { return isoOf(new Date()); }
function addDays(iso, n) { var p = iso.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2] + n); return isoOf(d); }
function daysBetween(a, b) { return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000); }
function fdate(iso) { var p = String(iso || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : ''; }
function qOf(iso) { return Math.floor((+iso.slice(5, 7) - 1) / 3) + 1; }
function sum(list, k) { return r2(list.reduce(function (a, x) { return a + (Number(x[k]) || 0); }, 0)); }
function byId(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
function empresa() { return byId(S.empresas, cur.empresaId); }
function byEmp(list) { return list.filter(function (x) { return x.empresaId === cur.empresaId; }); }
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function hit(obj, keys, q) { if (!q) return true; q = norm(q); return keys.some(function (k) { return norm(typeof k === 'function' ? k(obj) : obj[k]).indexOf(q) >= 0; }); }
function opt(v, label, sel) { return '<option value="' + esc(v) + '"' + (String(v) === String(sel) ? ' selected' : '') + '>' + esc(label) + '</option>'; }
function fd(form) { var o = {}; new FormData(form).forEach(function (v, k) { o[k] = v; }); return o; }

function toast(msg, cls, html) {
  var d = document.createElement('div');
  if (cls) d.className = cls;
  if (html) d.innerHTML = msg; else d.textContent = msg;
  var box = $('#toast');
  while (box.children.length > 2) box.firstChild.remove();
  box.appendChild(d);
  setTimeout(function () { d.remove(); }, cls === 'err' ? 9000 : 5000);
}
var nBusy = 0;
function busy(d) { nBusy += d; document.body.classList.toggle('busy', nBusy > 0); }

/** Llama al servidor. Si falla, muestra el error y la promesa no se resuelve. */
function call(action, payload) {
  return new Promise(function (res) {
    busy(1);
    google.script.run
      .withSuccessHandler(function (r) { busy(-1); var d = JSON.parse(r); merge(d); if (d.aviso) toast(d.aviso, 'err'); res(d); })
      .withFailureHandler(function (e) { busy(-1); toast(String((e && e.message) || e).replace(/^Error:\s*/, ''), 'err'); })
      .api(action, payload || {});
  });
}
function merge(d) {
  TABLES.forEach(function (t) {
    (d[t] || []).forEach(function (o) {
      var i = S[t].findIndex(function (x) { return x.id === o.id; });
      if (i >= 0) S[t][i] = o; else S[t].push(o);
    });
    if (d.deleted && d.deleted[t]) S[t] = S[t].filter(function (x) { return d.deleted[t].indexOf(x.id) < 0; });
  });
  if (d.backups) S.backups = d.backups;
}

function openDlg(html) { var d = $('#dlg'); d.innerHTML = html; if (!d.open) d.showModal(); }
function closeDlg() { var d = $('#dlg'); if (d.open) d.close(); d.innerHTML = ''; }
function ask(msg, okLabel, danger) {
  return new Promise(function (res) {
    var d = $('#cdlg');
    d.innerHTML = '<div class="dbody"><p style="margin-top:0">' + esc(msg) + '</p><div class="foot"><button class="btn" id="cNo">Cancelar</button><button class="btn pri" id="cSi">' + esc(okLabel || 'Aceptar') + '</button></div></div>';
    d.showModal();
    $('#cNo').onclick = function () { d.close(); };
    $('#cSi').onclick = function () { d.close(); res(true); };
  });
}
function fileToB64(file) {
  return new Promise(function (res, rej) {
    var fr = new FileReader();
    fr.onload = function () { res({ name: file.name, mime: file.type || 'application/octet-stream', data: String(fr.result).split(',')[1] }); };
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}
function download(name, rows) {
  var csv = rows.map(function (r) {
    return r.map(function (v) {
      if (typeof v === 'number') v = String(v).replace('.', ',');
      v = String(v === null || v === undefined ? '' : v);
      return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    }).join(';');
  }).join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name;
  a.target = '_blank';
  document.body.appendChild(a); a.click(); a.remove();
}

/* ============================ Cálculos ============================ */
function calcFactura(lineas, irpfPct) {
  var g = {}, base = 0;
  lineas.forEach(function (l) { var imp = r2(num(l.cantidad) * num(l.precio)); var k = String(num(l.ivaPct)); g[k] = r2((g[k] || 0) + imp); base = r2(base + imp); });
  var des = Object.keys(g).map(Number).sort(function (a, b) { return a - b; }).map(function (p) { return { pct: p, base: g[String(p)], cuota: r2(g[String(p)] * p / 100) }; });
  var iva = r2(des.reduce(function (a, d) { return a + d.cuota; }, 0)), irpf = r2(base * num(irpfPct) / 100);
  return { base: base, iva: iva, irpf: irpf, total: r2(base + iva - irpf), desglose: des };
}
function estadoF(f) {
  if (f.estado === 'borrador') return ['Borrador', ''];
  if (f.estado === 'cobrada') return [f.total < 0 ? 'Abonada' : 'Cobrada', 'ok'];
  if (f.vencimiento && f.vencimiento < today()) return ['Vencida', 'err'];
  return ['Pendiente', 'warn'];
}
function years() {
  var ys = {}; ys[new Date().getFullYear()] = 1;
  byEmp(S.facturas).concat(byEmp(S.gastos)).forEach(function (x) { if (x.fecha) ys[x.fecha.slice(0, 4)] = 1; });
  return Object.keys(ys).map(Number).sort(function (a, b) { return b - a; });
}
function yearSel() { return '<select data-c="year">' + years().map(function (y) { return opt(y, y, cur.year); }).join('') + '</select>'; }
function ivaResumen(y, q) {
  var inP = function (x) { return x.fecha && +x.fecha.slice(0, 4) === y && (!q || qOf(x.fecha) === q); };
  var fs = byEmp(S.facturas).filter(function (f) { return f.estado !== 'borrador' && inP(f); });
  var gs = byEmp(S.gastos).filter(inP);
  var rep = {}, sop = {};
  fs.forEach(function (f) { (f.desglose || []).forEach(function (d) { var o = rep[d.pct] || (rep[d.pct] = { base: 0, cuota: 0 }); o.base = r2(o.base + d.base); o.cuota = r2(o.cuota + d.cuota); }); });
  gs.forEach(function (g) { if (g.deducible === 'NO') return; var o = sop[g.ivaPct] || (sop[g.ivaPct] = { base: 0, cuota: 0 }); o.base = r2(o.base + g.base); o.cuota = r2(o.cuota + g.iva); });
  var tot = function (m) { return r2(Object.keys(m).reduce(function (a, k) { return a + m[k].cuota; }, 0)); };
  return { fs: fs, gs: gs, rep: rep, sop: sop, ivaRep: tot(rep), ivaSop: tot(sop), ingresos: sum(fs, 'base'), gastos: sum(gs, 'base'), irpfSop: sum(fs, 'irpf'), irpfPrac: sum(gs, 'irpf') };
}

/* ============================ Render ============================ */
function render() {
  $('#empSel').innerHTML = S.empresas.map(function (e) { return opt(e.id, e.nombre, cur.empresaId); }).join('');
  $('#empSel').style.display = S.empresas.length > 1 ? '' : 'none';
  var pend = byEmp(S.movimientos).filter(function (m) { return m.estado === 'pendiente'; }).length;
  var nSol = adm() ? S.solicitudes.filter(function (s) { return s.estado === 'pendiente'; }).length : 0;
  $('#nav').innerHTML = VIEWS.map(function (v) {
    return '<button data-a="go" data-v="' + v[0] + '" class="' + (cur.view === v[0] ? 'on' : '') + '">' + v[1] + (v[0] === 'banco' && pend ? ' <span class="badge warn">' + pend + '</span>' : '') + (v[0] === 'panel' && nSol ? ' <span class="badge err">' + nSol + '</span>' : '') + '</button>';
  }).join('');
  if (!empresa() && cur.view !== 'ajustes') cur.view = 'ajustes';
  $('#view').innerHTML = V[cur.view]();
}
var V = {};

V.panel = function () {
  var y = cur.year, t = ivaResumen(y, 0);
  var fs = byEmp(S.facturas).filter(function (f) { return f.estado === 'emitida' && f.total > 0; });
  var venc = fs.filter(function (f) { return f.vencimiento && f.vencimiento < today(); });
  var gp = byEmp(S.gastos).filter(function (g) { return g.estado === 'pendiente'; });
  var mp = byEmp(S.movimientos).filter(function (m) { return m.estado === 'pendiente'; }).length;
  var h = '<div class="bar"><h2 style="margin:0">Panel</h2><span class="sp"></span>' + yearSel() + '</div><div class="kpis">' +
    kpi('Facturado ' + y, eur(t.ingresos), 'base imponible') + kpi('Gastos ' + y, eur(t.gastos), 'base imponible') +
    kpi('Resultado ' + y, eur(r2(t.ingresos - t.gastos)), 'antes de impuestos') +
    kpi('Pendiente de cobro', eur(sum(fs, 'total')), fs.length + ' factura(s)' + (venc.length ? ' · ' + venc.length + ' vencida(s)' : '')) +
    kpi('Pendiente de pago', eur(sum(gp, 'total')), gp.length + ' gasto(s)') +
    kpi('Banco', mp + '', 'movimiento(s) sin conciliar') + '</div>';
  h += solicitudesHtml();
  h += '<h3>Por trimestre</h3><div class="card tw"><table><tr><th>Trimestre</th><th class="r">Ingresos</th><th class="r">Gastos</th><th class="r">IVA repercutido</th><th class="r">IVA soportado</th><th class="r">Resultado IVA</th></tr>';
  [1, 2, 3, 4].forEach(function (q) {
    var r = ivaResumen(y, q);
    h += '<tr><td>T' + q + '</td><td class="r">' + eur(r.ingresos) + '</td><td class="r">' + eur(r.gastos) + '</td><td class="r">' + eur(r.ivaRep) + '</td><td class="r">' + eur(r.ivaSop) + '</td><td class="r"><b>' + eur(r2(r.ivaRep - r.ivaSop)) + '</b></td></tr>';
  });
  h += '</table></div>';
  if (fs.length) {
    h += '<h3>Facturas pendientes de cobro</h3><div class="card tw"><table>';
    fs.sort(function (a, b) { return (a.vencimiento || a.fecha) < (b.vencimiento || b.fecha) ? -1 : 1; }).slice(0, 10).forEach(function (f) {
      var e = estadoF(f);
      h += '<tr><td>' + esc(f.numeroCompleto) + '</td><td>' + esc(f.cliente.nombre) + '</td><td class="mut">' + (f.vencimiento ? 'vence ' + fdate(f.vencimiento) : fdate(f.fecha)) + '</td><td class="r">' + eur(f.total) + '</td><td><span class="badge ' + e[1] + '">' + e[0] + '</span></td></tr>';
    });
    h += '</table></div>';
  }
  return h;
};
function solicitudesHtml() {
  var list = S.solicitudes.filter(function (s) { return adm() ? s.estado === 'pendiente' : true; }).sort(function (a, b) { return a.creado < b.creado ? 1 : -1; }).slice(0, 20);
  if (!list.length) return '';
  var h = '<h3>' + (adm() ? 'Solicitudes de cambio pendientes' : 'Tus solicitudes de cambio') + '</h3><div class="card tw"><table><tr><th>Fecha</th>' + (adm() ? '<th>De</th>' : '') + '<th>Sobre</th><th>Petición</th><th></th></tr>';
  list.forEach(function (s) {
    h += '<tr><td>' + fdate(String(s.creado).slice(0, 10)) + '</td>' + (adm() ? '<td>' + esc(s.usuario) + '</td>' : '') + '<td>' + esc(s.etiqueta) + '</td><td>' + esc(s.mensaje) + '</td><td class="act">' +
      (adm() ? '<button type="button" class="btn sm pri" data-a="resolverSol" data-id="' + esc(s.id) + '">Hecho</button>' : '<span class="badge ' + (s.estado === 'resuelta' ? 'ok' : 'warn') + '">' + (s.estado === 'resuelta' ? 'Resuelta' : 'Pendiente') + '</span>') + '</td></tr>';
  });
  return h + '</table></div>';
}
function kpi(l, v, s) { return '<div class="card kpi"><div class="l">' + esc(l) + '</div><div class="v">' + esc(v) + '</div><div class="s">' + esc(s) + '</div></div>'; }

V.facturas = function () {
  var list = byEmp(S.facturas).filter(function (f) {
    var e = estadoF(f)[0];
    var okF = cur.fF === 'todas' || (cur.fF === 'borrador' && f.estado === 'borrador') || (cur.fF === 'pendiente' && f.estado === 'emitida') || (cur.fF === 'vencida' && e === 'Vencida') || (cur.fF === 'cobrada' && f.estado === 'cobrada');
    return okF && hit(f, ['numeroCompleto', function (x) { return x.cliente && x.cliente.nombre; }, 'notas'], cur.sF);
  }).sort(function (a, b) {
    var da = a.estado === 'borrador' ? 1 : 0, db = b.estado === 'borrador' ? 1 : 0;
    if (da !== db) return db - da;

var STOP = { sociedad: 1, limitada: 1, anonima: 1, espana: 1, spain: 1, servicios: 1, grupo: 1, group: 1, company: 1, gmbh: 1, para: 1, transferencia: 1, recibo: 1, factura: 1 };

function candidatos(m, usados) {

    var nameMatch = tokens(nombre).some(function (t) { return c.indexOf(t) >= 0; });

  };
  byEmp(S.facturas).forEach(function (f) {
    if (f.estado === 'borrador' || f.movimientoId) return;
    if ((m.importe > 0) !== (f.total > 0)) return;
    add('factura', f, f.total, f.cliente.nombre, f.numeroCompleto, f.fecha);
  });
  if (m.importe < 0) byEmp(S.gastos).forEach(function (g) {
    if (g.movimientoId) return;
    add('gasto', g, -g.total, g.proveedor, g.numero, g.fecha);

function sugerencias(movs) {

    var cs = candidatos(m, usados).filter(function (x) { return x.exacto && x.dias >= -10 && x.dias <= 180; });
    if (!cs.length) return;

function parseDate(v) {

    draftF = { id: '', tipo: 'normal', clienteId: '', fecha: today(), vencimiento: e.diasVencimiento ? addDays(today(), e.diasVencimiento) : '', irpfPct: e.irpfDefecto || 0, notas: '', lineas: [{ concepto: '', cantidad: 1, precio: '', ivaPct: e.ivaDefecto === null ? 21 : e.ivaDefecto }] };
    dlgFactura();
  },
  editFactura: function (d) { var f = byId(S.facturas, d.id); draftF = JSON.parse(JSON.stringify(f)); dlgFactura(); },
  addLinea: function () { leerFactura(); var e = empresa(); draftF.lineas.push({ concepto: '', cantidad: 1, precio: '', ivaPct: e.ivaDefecto === null ? 21 : e.ivaDefecto }); dlgFactura(); },
  delLinea: function (d) { leerFactura(); draftF.lineas.splice(+d.i, 1); if (!draftF.lineas.length) draftF.lineas.push({ concepto: '', cantidad: 1, precio: '', ivaPct: 21 }); dlgFactura(); },
  emitir: function (d) { emitir(d.id); },
  delFactura: function (d) { ask('¿Eliminar este borrador?', 'Eliminar').then(function () { return call('deleteFactura', { id: d.id }); }).then(function () { done('Borrador eliminado.'); }); },
  pdf: function (d) { call('pdfFactura', { id: d.id }).then(function (r) { render(); toast('PDF generado. <a target="_blank" href="' + esc(r.facturas[0].pdfUrl) + '">Abrir</a>', '', true); }); },
  cobrar: function (d) { call('marcarCobro', { id: d.id, cobrada: true, fecha: today() }).then(function () { done('Marcada como cobrada hoy.'); }); },
  descobrar: function (d) { call('marcarCobro', { id: d.id, cobrada: false }).then(function () { done(); }); },
  rectificar: function (d) {
    var f = byId(S.facturas, d.id);
    ask('Se creará un borrador de factura rectificativa que anula por completo la ' + f.numeroCompleto + '. Podrás ajustar las líneas antes de emitirla.', 'Crear rectificativa').then(function () { return call('rectificar', { id: d.id }); })
      .then(function (r) { render(); draftF = JSON.parse(JSON.stringify(r.facturas[0])); dlgFactura(); });
  },
  expFacturas: function () {
    var rows = [['Número', 'Fecha', 'Cliente', 'NIF', 'Base', 'IVA', 'IRPF', 'Total', 'Estado', 'Vencimiento', 'Fecha de cobro', 'Rectifica a']];
    byEmp(S.facturas).filter(function (f) { return f.estado !== 'borrador'; }).sort(function (a, b) { return a.fecha === b.fecha ? a.numero - b.numero : (a.fecha < b.fecha ? -1 : 1); })
      .forEach(function (f) { rows.push([f.numeroCompleto, fdate(f.fecha), f.cliente.nombre, f.cliente.nif, f.base, f.iva, f.irpf, f.total, estadoF(f)[0], fdate(f.vencimiento), fdate(f.fechaCobro), f.rectificaRef]); });
    download('facturas-emitidas.csv', rows);
  },

  newGasto: function () { dlgGasto(); },
  editGasto: function (d) { dlgGasto(byId(S.gastos, d.id)); },
  delGasto: function (d) { ask('¿Eliminar este gasto? El justificante, si lo hay, se conserva en Drive.', 'Eliminar').then(function () { return call('deleteGasto', { id: d.id }); }).then(function () { done('Gasto eliminado.'); }); },
  pagar: function (d) { call('marcarPago', { id: d.id, pagado: true, fecha: today() }).then(function () { done('Marcado como pagado hoy.'); }); },
  despagar: function (d) { call('marcarPago', { id: d.id, pagado: false }).then(function () { done(); }); },
  expGastos: function () { download('gastos.csv', librosGastos(byEmp(S.gastos))); },
  expTrimestre: function () {
    var r = ivaResumen(cur.year, cur.q), tag = cur.year + '-T' + cur.q;
    var rows = [['Número', 'Fecha', 'Cliente', 'NIF', 'Base', 'Tipo IVA', 'Cuota IVA', 'IRPF', 'Total factura']];
    r.fs.sort(function (a, b) { return a.fecha === b.fecha ? a.numero - b.numero : (a.fecha < b.fecha ? -1 : 1); }).forEach(function (f) {
      (f.desglose || []).forEach(function (d, i) { rows.push([f.numeroCompleto, fdate(f.fecha), f.cliente.nombre, f.cliente.nif, d.base, d.pct, d.cuota, i ? '' : f.irpf, i ? '' : f.total]); });
    });
    download('libro-facturas-emitidas-' + tag + '.csv', rows);
    setTimeout(function () { download('libro-facturas-recibidas-' + tag + '.csv', librosGastos(r.gs)); }, 400);
  },

  conciliar: function (d) { call('conciliarLote', { items: [{ movId: d.id, refTipo: d.tipo, refId: d.ref }] }).then(function (r) { if (r.errores.length) toast(r.errores[0], 'err'); done(r.errores.length ? '' : 'Movimiento conciliado.'); }); },
  conciliarSeguras: function () {
    var sug = sugerencias(byEmp(S.movimientos).filter(function (m) { return m.estado === 'pendiente'; }));
    var items = Object.keys(sug).filter(function (k) { return sug[k].conf === 'alta'; }).map(function (k) { return { movId: k, refTipo: sug[k].tipo, refId: sug[k].id }; });
    call('conciliarLote', { items: items }).then(function (r) { done(r.movimientos.length + ' movimiento(s) conciliado(s).'); });
  },
  desconciliar: function (d) { call('desconciliar', { movId: d.id }).then(function () { done('Conciliación deshecha.'); }); },
  ignorar: function (d) { call('ignorarMov', { id: d.id, ignorar: true }).then(function () { done(); }); },
  recuperar: function (d) { call('ignorarMov', { id: d.id, ignorar: false }).then(function () { done(); }); },
  delMov: function (d) { ask('¿Eliminar este movimiento? Si vuelves a importar el mismo extracto, reaparecerá.', 'Eliminar').then(function () { return call('deleteMovimiento', { id: d.id }); }).then(function () { done(); }); },
  buscarDoc: function (d) { dlgBuscar(byId(S.movimientos, d.id)); },
  leerGasto: function () { leerGasto(); },
  pedirCambio: function (d) {
    openDlg('<form data-f="solicitud"><h2>Pedir un cambio</h2><p class="mut" style="margin-top:0">' + esc(d.et) + '</p><input type="hidden" name="refTipo" value="' + esc(d.tipo) + '"><input type="hidden" name="refId" value="' + esc(d.id) + '"><input type="hidden" name="etiqueta" value="' + esc(d.et) + '">' +
      '<div class="grid"><label class="c12">¿Qué hay que modificar o eliminar?<textarea name="mensaje" required maxlength="1000"></textarea></label></div>' +
      '<div class="foot"><button type="button" class="btn" data-a="closeDlg">Cancelar</button><button class="btn pri">Enviar solicitud</button></div></form>');
  },
  resolverSol: function (d) { call('resolverSolicitud', { id: d.id }).then(function () { done('Solicitud marcada como resuelta.'); }); },
  gastoDesdeMov: function (d) {
    var m = byId(S.movimientos, d.id), e = empresa(), iva = e.ivaDefecto === null ? 21 : e.ivaDefecto, total = r2(-m.importe);
    dlgGasto({ fecha: m.fecha, concepto: m.concepto, proveedor: '', ivaPct: iva, irpfPct: 0, total: total, base: r2(total / (1 + iva / 100)), deducible: 'SI', categoria: '' }, m.id);
  }
};
/** Envía el justificante elegido a Gemini y rellena el formulario de gasto con lo que devuelve. */
function leerGasto() {
  var form = $('#dlg form[data-f=gasto]');
  if (!form || !S.ia) return;
  var file = $('[name=file]', form).files[0];
  if (!file) return toast('Elige primero el archivo del justificante.', 'err');
  if (file.size > 10 * 1024 * 1024) return toast('El justificante supera los 10 MB.', 'err');
  if (file.type !== 'application/pdf' && file.type.indexOf('image/') !== 0) return toast('Solo se pueden leer PDF o imágenes.', 'err');
  var box = $('#iaBox'), prev = box.innerHTML;
  box.innerHTML = '<span class="mut small">Leyendo el documento…</span>';
  var fallo = setTimeout(function () { if ($('#iaBox') === box && /Leyendo/.test(box.textContent)) box.innerHTML = prev; }, 90000);
  fileToB64(file).then(function (f) { return call('analizarGasto', { empresaId: cur.empresaId, file: f }); }).then(function (r) {
    clearTimeout(fallo);
    if ($('#dlg form[data-f=gasto]') !== form) return;          // el diálogo se cerró mientras tanto
    var s = r.sugerencia, set = function (n, v) { if (v !== null && v !== undefined && v !== '') $('[name=' + n + ']', form).value = v; };
    set('proveedor', s.proveedor); set('nif', s.nif); set('numero', s.numero); set('fecha', s.fecha); set('concepto', s.concepto);
    if (s.categoria) set('categoria', s.categoria);
    var sel = $('[name=ivaPct]', form);
    if (s.ivaPct !== null && !Array.prototype.some.call(sel.options, function (o) { return +o.value === +s.ivaPct; })) sel.insertAdjacentHTML('beforeend', opt(s.ivaPct, s.ivaPct + ' %'));
    if (s.ivaPct !== null) sel.value = String(s.ivaPct);
    $('[name=irpfPct]', form).value = s.irpfPct || 0;
    if (s.base !== null) {
      $('[name=base]', form).value = s.base;
      $('[name=total]', form).value = r2(s.base + r2(s.base * num(sel.value) / 100) - r2(s.base * num(s.irpfPct) / 100));
    }
    box.innerHTML = '<div class="note" style="margin:0">Datos leídos del documento con IA. <b>Revísalos antes de guardar.</b>' +
      s.avisos.map(function (a) { return '<div style="color:var(--err)">⚠ ' + esc(a) + '</div>'; }).join('') +
      '</div><button type="button" class="btn sm" data-a="leerGasto" style="margin-top:6px">Volver a leer</button>';
  });
  // Si el servidor falla, call() muestra el error; se restaura el botón.
  var obs = new MutationObserver(function () { if (document.querySelector('#toast .err') && /Leyendo/.test(box.textContent)) { clearTimeout(fallo); box.innerHTML = prev; obs.disconnect(); } });
  obs.observe($('#toast'), { childList: true });
  setTimeout(function () { obs.disconnect(); }, 95000);
}
function librosGastos(list) {
  var rows = [['Fecha', 'Proveedor', 'NIF', 'Nº factura', 'Concepto', 'Categoría', 'Base', 'Tipo IVA', 'Cuota IVA', 'IRPF', 'Total', 'IVA deducible', 'Estado', 'Fecha de pago', 'Justificante']];
  list.slice().sort(function (a, b) { return a.fecha < b.fecha ? -1 : 1; }).forEach(function (g) { rows.push([fdate(g.fecha), g.proveedor, g.nif, g.numero, g.concepto, g.categoria, g.base, g.ivaPct, g.iva, g.irpf, g.total, g.deducible, g.estado, fdate(g.fechaPago), g.adjuntoUrl]); });
  return rows;
}
function emitir(id) {
  ask('Al emitir se asigna el número definitivo y la factura ya no se puede modificar ni eliminar (solo rectificar).', 'Emitir factura')
    .then(function () { return call('emitirFactura', { id: id }); })
    .then(function (r) { var f = r.facturas[0]; closeDlg(); render(); toast('Factura ' + esc(f.numeroCompleto) + ' emitida.' + (f.pdfUrl ? ' <a target="_blank" href="' + esc(f.pdfUrl) + '">Abrir PDF</a>' : ''), '', true); });
}

/* Formularios */
var F = {
  empresa: function (form) {
    call('saveEmpresa', fd(form)).then(function (r) { if (!cur.empresaId) cur.empresaId = r.empresas[0].id; if (cur.view === 'ajustes' && S.empresas.length === 1) cur.view = 'panel'; done('Empresa guardada.'); });
  },
  cliente: function (form) {
    var o = fd(form);
    call('saveCliente', o).then(function (r) {
      if (o.volver) { draftF.clienteId = r.clientes[0].id; render(); dlgFactura(); } else done('Cliente guardado.');
    });
  },
  factura: function (form, submitter) {
    leerFactura();
    var lineas = draftF.lineas.filter(function (l) { return String(l.concepto).trim() || num(l.cantidad) * num(l.precio) !== 0; });
    if (!lineas.length) return toast('Añade al menos una línea.', 'err');
    var p = { id: draftF.id, empresaId: cur.empresaId, clienteId: draftF.clienteId, fecha: draftF.fecha, vencimiento: draftF.vencimiento, irpfPct: draftF.irpfPct, notas: draftF.notas, lineas: lineas };
    call('saveFactura', p).then(function (r) {
      draftF.id = r.facturas[0].id;
      if (submitter && submitter.value === 'emitir') { render(); emitir(draftF.id); } else done('Borrador guardado.');
    });
  },
  gasto: function (form) {
    var o = fd(form), file = $('[name=file]', form).files[0];
    var p = { id: o.id, empresaId: cur.empresaId, fecha: o.fecha, proveedor: o.proveedor, nif: o.nif, numero: o.numero, concepto: o.concepto, categoria: o.categoria, base: num(o.base), ivaPct: num(o.ivaPct), irpfPct: num(o.irpfPct), deducible: !!o.deducible, pagado: !!o.pagado, fechaPago: o.fechaPago, notas: o.notas, conciliarMovId: o.conciliarMovId };
    if (file && file.size > 10 * 1024 * 1024) return toast('El justificante supera los 10 MB.', 'err');
    (file ? fileToB64(file) : Promise.resolve(null)).then(function (f) { if (f) p.file = f; return call('saveGasto', p); }).then(function () { done('Gasto guardado.'); });
  },
  solicitud: function (form) { call('solicitar', fd(form)).then(function () { done('Solicitud enviada. Puedes seguirla en el Panel.'); }); },
  importar: function (form) {
    var cuenta = fd(form).cuenta, rows = bankDraft.n43 || construirMovs(bankDraft);
    call('importMovimientos', { empresaId: cur.empresaId, cuenta: cuenta, rows: rows }).then(function (r) {
      var msg = r.importados + ' movimiento(s) importado(s)' + (r.duplicados ? ', ' + r.duplicados + ' ya existían' : '') + '.';
      var sug = sugerencias(r.movimientos);
      var items = Object.keys(sug).filter(function (k) { return sug[k].conf === 'alta'; }).map(function (k) { return { movId: k, refTipo: sug[k].tipo, refId: sug[k].id }; });
      cur.view = 'banco'; cur.fB = 'pendiente';
      if (!items.length) return done(msg);
      call('conciliarLote', { items: items }).then(function (c) { done(msg + ' ' + c.movimientos.length + ' conciliado(s) automáticamente.'); });
    });
  }
};

/* Cambios en controles */
var C = {
  empresa: function (el) { cur.empresaId = el.value; render(); },
  year: function (el) { cur.year = +el.value; render(); },
  q: function (el) { cur.q = +el.value; render(); },
  fF: function (el) { cur.fF = el.value; render(); },
  fG: function (el) { cur.fG = el.value; render(); },
  fB: function (el) { cur.fB = el.value; render(); },
  clienteFactura: function (el) { if (el.value === '__nuevo') { leerFactura(); dlgCliente(null, true); } },
  logo: function (el) {
    var f = el.files[0]; if (!f) return;
    if (f.size > 2 * 1024 * 1024) return toast('El logo supera los 2 MB.', 'err');
    fileToB64(f).then(function (file) { return call('uploadLogo', { empresaId: el.dataset.id, file: file }); }).then(function () { done('Logo guardado. Aparecerá en las próximas facturas.'); });
  },
  bankFile: function (el) {
    var f = el.files[0]; if (!f) return;
    el.value = '';
    leerExtracto(f).then(function (p) {
      bankDraft = { fileName: f.name };
      if (p.n43) bankDraft.n43 = p.n43;
      else { var det = detectar(p.rows); bankDraft.rows = p.rows; bankDraft.headerRow = det.headerRow; bankDraft.map = det.map; }
      dlgExtracto();
    }).catch(function (e) { toast(e.message || 'No se pudo leer el archivo.', 'err'); });
  },
  gastoFile: function (el) { if (S.ia && el.dataset.auto && el.files[0]) leerGasto(); },
  bankMap: function (el) {
    var inp = $('#dlg [name=cuenta]'); if (inp) bankDraft.cuenta = inp.value;
    if (el.dataset.k === 'headerRow') bankDraft.headerRow = +el.value; else bankDraft.map[el.dataset.k] = +el.value;
    if (el.dataset.k === 'importe' && +el.value >= 0) { bankDraft.map.cargo = -1; bankDraft.map.abono = -1; }
    if ((el.dataset.k === 'cargo' || el.dataset.k === 'abono') && +el.value >= 0) bankDraft.map.importe = -1;
    dlgExtracto();
  }
};
var SEARCH = { sF: 1, sG: 1, sB: 1, sC: 1 };

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-a]');
  if (!el || !A[el.dataset.a]) return;
  ev.preventDefault();
  A[el.dataset.a](el.dataset, el);
});
document.addEventListener('change', function (ev) {
  var el = ev.target, k = el.dataset && el.dataset.c;
  if (k && C[k]) C[k](el);
});
document.addEventListener('input', function (ev) {
  var el = ev.target, k = el.dataset && el.dataset.c;
  if (k && SEARCH[k]) {            // búsqueda: se vuelve a pintar y se conserva el foco
    cur[k] = el.value; var pos = el.selectionStart; render();
    var n = $('[data-c=' + k + ']'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} }
    return;
  }
  var form = el.closest && el.closest('form');
  if (!form) return;
  if (form.dataset.f === 'factura') {
    leerFactura();
    $$('.linea', form).forEach(function (tr, i) { $('.imp', tr).textContent = eur(r2(num(draftF.lineas[i].cantidad) * num(draftF.lineas[i].precio))); });
    $('#totF').innerHTML = totHtml(calcFactura(draftF.lineas, draftF.irpfPct), draftF.irpfPct);
  } else if (form.dataset.f === 'gasto') {
    var g = function (n) { return $('[name=' + n + ']', form); }, k2 = 1 + num(g('ivaPct').value) / 100 - num(g('irpfPct').value) / 100;
    if (k === 'gastoTotal') g('base').value = g('total').value === '' ? '' : r2(num(g('total').value) / k2);
    else if (k === 'gastoCalc') { var bs = r2(num(g('base').value)); g('total').value = g('base').value === '' ? '' : r2(bs + r2(bs * num(g('ivaPct').value) / 100) - r2(bs * num(g('irpfPct').value) / 100)); }
  }
});
document.addEventListener('submit', function (ev) {
  var form = ev.target;
  ev.preventDefault();
  if (form.dataset.f && F[form.dataset.f]) F[form.dataset.f](form, ev.submitter);
});
$('#dlg').addEventListener('cancel', function () { setTimeout(function () { $('#dlg').innerHTML = ''; }, 0); });

/* ============================ Arranque ============================ */
call('bootstrap').then(function (d) {
  S.user = d.user; S.autorizados = d.autorizados; S.links = d.links || {}; S.ia = !!d.ia; S.rol = d.rol || 'admin'; S.asistentes = d.asistentes || '';
  cur.empresaId = S.empresas[0] ? S.empresas[0].id : '';
  render();
  if (!S.empresas.length && adm()) dlgEmpresa();
});
</script>
